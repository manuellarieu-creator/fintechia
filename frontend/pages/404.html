<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page introuvable — Fintechia</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340..600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0F1B33; display: flex; align-items: center; justify-content: center; }
    * { box-sizing: border-box; }
    
    .nb { font-family:'Inter',sans-serif; color:#E9E6DD; text-align: center; }
    .nb-serif { font-family:'Fraunces',serif; font-optical-sizing:auto; }
    .nb-mono { font-family:'IBM Plex Mono',monospace; }
    
    .nb-btn { transition:opacity .15s ease; cursor:pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; border: none; }
    .nb-btn:hover { opacity:.85; }
  </style>
</head>
<body>
  <div class="nb">
    <p class="nb-mono" style="font-size:16px;letter-spacing:.14em;color:#C99A3B;margin:0 0 18px;">ERREUR 404</p>
    <h1 class="nb-serif" style="font-size:64px;line-height:1.08;font-weight:400;margin:0 0 22px;color:#F4F1E9;">
      Cette page s'est perdue<br>en chemin.
    </h1>
    <p style="font-size:16px;line-height:1.7;color:#B9B4A6;max-width:440px;margin:0 auto 40px;">
      La page que vous cherchez n'existe pas ou a été déplacée. Retournez à l'accueil pour reprendre le fil.
    </p>
    <a href="/" class="nb-btn" style="background:#C99A3B;color:#0F1B33;font-weight:600;padding:13px 26px;border-radius:6px;font-size:14px;font-family:inherit;">
      Retourner à l'accueil
    </a>
  </div>
  <script src="/assets/js/i18n.js"></script>
</body>
</html>
